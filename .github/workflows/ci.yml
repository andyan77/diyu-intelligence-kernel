# 笛语智能核 · M0 门禁 CI（P0-5「可传播门禁」；施工真源 M0收口修复批次_执行规格.md §二 P0-5）
#
# 为什么要有它（外部审查 BLOCK-05）：本地钩子不随 clone 分发，且 `git commit --no-verify` 一句就能绕过。
# 门禁只有跑在**服务端、且绕不过去**的地方才算数。本工作流就是那一处。
#
# 与本地的关系：CI **不另起一套判据**——它跑的就是本地那一条命令 `python3 tools/check_m0.py`，
# 逐字一致。两边口径必须同源：CI 里另写一串 pytest/自定义断言 = 第二套考卷，本地绿 CI 红（或反过来）
# 时没人说得清谁对。要改判绿口径，改 tools/check_m0.py 一处，两边同步生效。
#
# ⚠ 本文件**不能**自己给自己设分支保护。「main required check + 分支保护」是 GitHub 仓库设置
# （Settings → Branches → Branch protection rules），必须由仓库管理员在网页端手动开一次，
# 勾选 required status check = 下面的 job 名 **check_m0**（job 名与 name 都钉成这个串，就是为了给它引用）。
# 在管理员点下那一步之前，本工作流只是"会跑并会报红"，**不构成**"红了就合不进去"的强制力——
# 这条差别必须在 P0-6 回执里如实写明，不得用"CI 已就位"一句盖过去。
#
# 残余面（诚实披露，别把本文件读成"门禁已全覆盖"；IA-1 送签前置收尾块 2026-08-18 更新）：
#   · ~~C.2 隔离门只在本地钩子~~ → 已复刻进本工作流（下方「C.2 隔离门」步，判据与 .githooks/pre-commit
#     前 9 行逐字同源：kernel/ 与 acceptance/|contracts/ 不得同 commit）。真实覆盖粒度如实写明：
#     **pull_request 事件逐 commit 核验**（工作提交必须分区，--no-verify 绕过本地钩子在此被抓）；
#     push-to-main 事件跳过——main 只能经 PR 合入（分支保护），而 squash 合并产物本就是把已核验的
#     分区提交折叠成单提交，对它再跑逐 commit 判据会把每次合并都误判成混区；PR 内的 merge commit
#     （>1 父提交）跳过并打印留痕（其引入的改动已由其父链上的工作提交逐个受检）。
#   · C.6.1 尝试账本门（kernel 改动须先登记 ATT 条目）**仍只在本地钩子**——本块「不新增检查种类」，
#     其服务端复刻未派发，未做就是未做；
#   · 冻结门**运行态**按 M0 设计必然红（PENDING_BUILD），故不计入 check_m0 判绿条件，CI 同理；
#   · CI 绿 ≠ Founder 已签字 ≠ 案例质量合格（口径见 tools/check_m0.py 文件头「诚实边界」）。
#
# 供应链封闭化（IA-1 送签前置收尾块 2026-08-18；原「残余面」三条中前两条已关闭）：
#   · `pip install --require-hashes -r requirements-lock.txt`：直接 + 传递依赖（attrs / pyrsistent /
#     six / setuptools）全量钉版 + sha256 哈希——锁文件由干净 venv 实测生成（生成方法与实测记录见
#     requirements-lock.txt 头注），版本或字节与清单不符即安装失败；requirements.txt 仍是直接依赖
#     的人读真源，改它必须同批重生成锁文件；
#   · pip 钉版 25.2（安装锁文件前先钉 pip 自身）；python-version 钉到 patch：'3.10.12'（与本地取证
#     解释器同 patch，原 '3.10' 浮动 patch 的披露作废）；
#   · 本工作流**未启用任何缓存**（setup-python 无 cache 输入、无 actions/cache 步），缓存投毒面为零；
#   · 仍未封闭（如实保留）：ubuntu-latest 运行器镜像自身（OS 包、预装工具链）随 GitHub 滚动——
#     钉死那一层要自托管 runner 或容器镜像 digest，超出「测试依赖」范围，未做就是未做。

name: M0 门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 管理员手动复跑取证用：出 P0-6 回执时需要能对着某个 ref 再跑一次，没有它就只能靠推空提交触发。
  workflow_dispatch:

# 最小权限：本工作流只读代码，不写仓库、不发包、不动 issue。
permissions:
  contents: read

# 同一分支上后来的推送取消先前仍在跑的：既省重复消耗，也避免两轮结论以不定顺序回写状态，
# 让"这个 SHA 到底是绿还是红"变成时序问题。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id 与 name 都是 check_m0：分支保护的 required status check 按这个串引用，改名会让保护规则失配。
  check_m0:
    name: check_m0
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # third-party action 一律钉 **commit SHA**，不用可变 tag：tag 可以被重新指向另一个提交，
      # 那等于让别人在我们的 CI 里执行任意代码——而这条 CI 正是"绕不过去的那道门"。
      # 下面两个 SHA 是 2026-08-17 从 GitHub API 解析 tag 得到的实值（非凭记忆填写），已核验确为
      # 该仓库中存在的提交；注释里的 v4 / v5 只是给人看的可读标签，生效的是 SHA。
      # 升级动作 = 重新解析新 tag 的 SHA 并同批改注释，不得只改注释。
      - name: 取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（2026-08-18 GitHub API 解析 tag 实值；原 v4 SHA 触发 Node 20 弃用警告，E-18/告别块清除）
        with:
          # fetch-depth: 0 取全历史。默认的 1 只有一个提交，freeze_gate / check_m0 归属行里那个
          # SHA 在浅克隆里无从复查，C.2 隔离门步的逐 commit diff 也需要完整父链。另需在 P0-6 回执里写明：
          # pull_request 事件下 checkout 检出的是临时 merge commit，那个 SHA **不存在于仓库历史**，
          # 要引用请用 push 事件或 workflow_dispatch 那轮。
          fetch-depth: 0

      # C.2 隔离门服务端复刻（IA-1 送签前置收尾块；判据与 .githooks/pre-commit 前 9 行逐字同源）。
      # 只在 pull_request 事件逐 commit 核验；push/main 与 merge commit 的跳过理由见文件头「残余面」。
      # 本步失败 → 本 job（required check check_m0）红 → 合并被分支保护物理拒绝——不是第二套考卷，
      # 是把本地那道门搬到绕不过去的地方（--no-verify 在此失效）。
      - name: C.2 隔离门（服务端，逐 commit）
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for c in $(git rev-list --reverse "$BASE_SHA".."$HEAD_SHA"); do
            if [ "$(git rev-list --no-walk --count --merges "$c")" = "1" ]; then
              echo "SKIP [C.2] $c 是 merge commit（>1 父），其改动已由父链工作提交逐个受检"
              continue
            fi
            files=$(git diff-tree --no-commit-id --name-only -r "$c")
            echo "$files" | grep -q  '^kernel/'                && k=1 || k=0
            echo "$files" | grep -qE '^(acceptance|contracts)/' && e=1 || e=0
            if [ "$k" = "1" ] && [ "$e" = "1" ]; then
              echo "REJECT [C.2 隔离门·服务端] commit $c 同时改考生区(kernel/)与考卷/考试条件区(acceptance/|contracts/)——请拆分为两次提交后重推。"
              fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "C.2 隔离门（服务端）：$(git rev-list --count "$BASE_SHA".."$HEAD_SHA") 个提交逐一核验，零混区"
          exit "$fail"

      # 基线解释器钉到 patch：3.10.12（与本地取证解释器同 patch；requirements-lock.txt 头注同源，两边必须一起改）。
      - name: 装 Python 3.10.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0（2026-08-18 GitHub API 解析 tag 实值；原 v5 SHA 触发 Node 20 弃用警告，E-18/告别块清除）
        with:
          python-version: '3.10.12'

      # 封闭化安装（见文件头「供应链封闭化」）：先钉 pip 自身，再按全量哈希锁装——
      # 任何包版本或字节与 requirements-lock.txt 不符即安装失败，不要退回 `pip install -r requirements.txt`。
      - name: 装封闭锁依赖
        run: |
          python -m pip install 'pip==25.2'
          pip install --require-hashes -r requirements-lock.txt

      # 与本地自测命令**逐字一致**的那一条。它自己会打印 CHECK_M0_GREEN / CHECK_M0_RED 与归属块，
      # 非 0 退出即 job 红。不要在这里追加 `|| true` 之类的兜底——那等于把门禁关掉还留个绿勾。
      - name: 跑 M0 门禁
        run: python3 tools/check_m0.py
