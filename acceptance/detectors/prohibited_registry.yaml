# 禁止结果检测注册表（C.4 铁律1：每条挂 deterministic:<ID>/llm_assisted:<ID>/human_required/not_detectable_declared）
# 后两种状态下该项结果只能是 PENDING_HUMAN。本文件属考卷区，改状态=改考卷。
